name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict
      - name: Lintable checks itself
        run: swift run lintable lint --reporter github
      - name: Rule docs are up to date
        run: |
          swift run lintable docs --output docs/rules
          git diff --exit-code docs/rules
      - name: Plugin smoke test
        run: script/plugin-smoke-test.sh

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  custom-linter:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Custom linter template, source and prebuilt plugins
        run: script/custom-linter-smoke-test.sh --with-binary

  custom-linter-linux:
    runs-on: ubuntu-24.04
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Custom linter template and source plugin
        run: script/custom-linter-smoke-test.sh

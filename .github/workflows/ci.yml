name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

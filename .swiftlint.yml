included:
  - Sources
  - Tests
  - Package.swift
excluded:
  - .build
disabled_rules:
  - optional_data_string_conversion
opt_in_rules:
  - closure_spacing
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - first_where
  - force_unwrapping
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
trailing_comma:
  mandatory_comma: true
opening_brace:
  ignore_multiline_statement_conditions: true
  ignore_multiline_type_headers: true
  ignore_multiline_function_signatures: true
line_length:
  warning: 160
  error: 220
  ignores_multiline_strings: true
identifier_name:
  excluded: [id, x, y]
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 600
  error: 1000
function_body_length:
  warning: 80
  error: 160
cyclomatic_complexity:
  warning: 15
  error: 25
custom_rules:
  no_comments:
    name: No Comments
    regex: '(?m)(?:^[ \t]*//(?!\s*(?:swiftlint|lintable):|\s*swift-tools-version)[ \t]*\S[^\n]*|//(?!\s*(?:swiftlint|lintable):|\s*swift-tools-version)[ \t]*\S[^\n]*|/\*[\s\S]*?\*/)'
    match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
    message: "Comments aren't allowed. Make the code explain itself; document public API in the target's DocC catalog."
    severity: error
